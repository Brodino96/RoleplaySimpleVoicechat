name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.2.1"

      - name: Read versions
        id: version
        shell: bash
        run: |
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          echo "version=${minecraft_version}-${mod_version}" >> "$GITHUB_OUTPUT"
          echo "minecraft=${minecraft_version}" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: gradle build

      - name: Publish release
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: SummonMounts ${{ steps.version.outputs.version }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          version: ${{ steps.version.outputs.version }}
          version-type: release

          loaders: fabric
          game-versions: ${{ steps.version.outputs.minecraft }}
          environment: client | server
          dependencies: |
            fabric@0.77.0+1.19.2(required){modrinth:P7dR8mSH}{curseforge:306612}
            voicechat@1.19.2-2.6.13(required){modrinth:9eGKb6K1}{curseforge:416089}

          github-tag: v${{ steps.version.outputs.version }}
          github-generate-changelog: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

          modrinth-id: 8vETqaVA
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1348703
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
